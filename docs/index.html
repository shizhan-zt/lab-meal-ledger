<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18594b">
  <title>实验室买饭账本</title>
  <style>
    :root{--ink:#17211d;--muted:#66736c;--line:#d9e3dc;--bg:#f5f7f3;--white:#fff;--green:#18594b;--green-soft:#e4f1e9;--orange:#b74c22;--orange-soft:#fff0e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:680px;min-height:100vh;margin:auto}header{padding:22px 18px 17px;color:#fff;background:var(--green)}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#d8eee2;font-size:14px}.identity-bar{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}.identity-bar button{min-height:30px;padding:0 9px;color:#e0f2e7;background:transparent;border:1px solid #8fbda2;border-radius:5px;font:inherit}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}.tabs button{flex:0 0 auto;min-height:38px;padding:0 13px;color:#456158;background:#f0f4f0;border:1px solid #e0e8e1;border-radius:6px;font-size:14px;font-weight:650}.tabs button.active,.primary{color:#fff;background:var(--green);border-color:var(--green)}main{padding:14px}.card{margin-bottom:14px;padding:15px;background:var(--white);border:1px solid var(--line);border-radius:8px}h2{margin:0 0 9px;font-size:18px}.sub{margin:0;color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.metric{padding:13px;background:#fff;border:1px solid var(--line);border-radius:8px}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;margin-top:4px;font-size:22px}.orange{color:var(--orange)}.list{margin:0;padding:0;list-style:none}.meal-row{display:grid;grid-template-columns:72px minmax(0,1fr) 90px;gap:7px 9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.meal-row:last-child,.overview-row:last-child{border-bottom:0}.name{grid-column:1;grid-row:1/3;overflow:hidden;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.food{grid-column:2/4;grid-row:1}.amount{grid-column:2;grid-row:2;text-align:right}.buyer-field{grid-column:3;grid-row:2}.food,.amount,.add input,.buyer-select{width:100%;height:40px;padding:7px 8px;background:#fff;border:1px solid #bccbc2;border-radius:6px}.food:focus,.amount:focus,.add input:focus,.buyer-select:focus{outline:2px solid #b4d8c3;border-color:var(--green)}.settle{grid-column:2/4;grid-row:3;display:flex;align-items:center;justify-content:flex-start;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap}.switch{position:relative;display:inline-block;width:40px;height:24px}.switch input{width:0;height:0;opacity:0}.slider{position:absolute;inset:0;border-radius:14px;background:#c7d0ca}.slider:before{position:absolute;bottom:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;content:"";transition:.15s}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:before{transform:translateX(16px)}.switch input:disabled+.slider{background:#e0e6e2}.overview-row{display:grid;grid-template-columns:minmax(75px,1fr) minmax(145px,2.2fr);gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.chips{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}.chip{padding:3px 6px;border-radius:4px;background:var(--orange-soft);color:var(--orange);font-size:12px;font-weight:650;white-space:nowrap}.paid{padding:3px 7px;border-radius:4px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700}.primary,.secondary{min-height:42px;padding:0 14px;border:0;border-radius:7px;font-weight:700}.secondary{color:var(--green);background:#edf4ef;border:1px solid #bfd5c7}.wide{width:100%}.add,.tools{display:flex;gap:8px;margin-top:13px}.add input{min-width:0;flex:1}.buyer-select{color:var(--ink)}.note{margin:0 0 12px;padding:10px;color:#476258;background:#edf4ef;border-radius:6px;font-size:13px}.total{display:flex;justify-content:space-between;padding-top:12px;margin-top:4px;border-top:1px solid var(--line);font-weight:700}.identity-choice{max-width:420px;margin:50px auto}.identity-choice .tools{display:grid;grid-template-columns:1fr 1fr}.toast{position:fixed;right:14px;bottom:18px;z-index:2;padding:10px 12px;color:#fff;background:#273b32;border-radius:6px;font-size:14px}@media(max-width:360px){.meal-row{grid-template-columns:61px minmax(0,1fr) 82px;gap:6px}.amount,.food{padding:7px 5px}.settle{gap:3px}}
  </style>
</head>
<body><div class="app"><header><h1>实验室买饭账本</h1><p>两部手机共同记录，自动同步。</p><div class="identity-bar" id="identityBar" hidden>当前身份：<strong id="identityName"></strong><button id="changeIdentity" type="button">更改身份</button></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main></div><div id="toast" class="toast" hidden></div>
<script src="./config.js"></script><script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const MEALS=[['0729d','7.29晚饭'],['0730b','7.30早饭'],['0730l','7.30午饭'],['0730d','7.30晚饭'],['0731b','7.31早饭'],['0731l','7.31午饭'],['0731d','7.31晚饭'],['0801b','8.1早饭'],['0801l','8.1午饭'],['0801d','8.1晚饭'],['0802b','8.2早饭'],['0802l','8.2午饭'],['0802d','8.2晚饭']].map(([id,label])=>({id,label}));
const BUYERS=['施展','刘馨遥'],$=id=>document.getElementById(id),money=c=>'¥'+(c/100).toFixed(2),esc=s=>{const e=document.createElement('div');e.textContent=s||'';return e.innerHTML};let db,ledger={people:[],entries:[]},active='overview',timer,refreshTimer,refreshPausedUntil=0,subscribed=false;
function toast(message){const n=$('toast');n.textContent=message;n.hidden=false;clearTimeout(timer);timer=setTimeout(()=>n.hidden=true,2600)}
function configured(){return window.SUPABASE_URL&&!window.SUPABASE_URL.includes('PASTE_')&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_ANON_KEY.includes('PASTE_')}
function entry(mealId,personId){return ledger.entries.find(x=>x.meal_id===mealId&&x.person_id===personId)||{meal_id:mealId,person_id:personId,buyer:identity()||BUYERS[0],food:'',cents:0,settled:false}}
async function load(){const [p,e]=await Promise.all([db.from('people').select('*').order('created_at'),db.from('meal_entries').select('*')]);for(const r of[p,e])if(r.error)throw r.error;ledger={people:p.data,entries:e.data};render()}
function editingEntry(){return document.activeElement?.matches('[data-food],[data-amount],[data-buyer]')}
function scheduleLoad(){clearTimeout(refreshTimer);const wait=Math.max(350,refreshPausedUntil-Date.now());refreshTimer=setTimeout(()=>{if(editingEntry())return scheduleLoad();load().catch(error=>toast(error.message))},wait)}
function identity(){return localStorage.getItem('lab-meal-identity')}
function updateIdentityUI(){const name=identity(),bar=$('identityBar');bar.hidden=!name;if(name)$('identityName').textContent=name}
function showIdentity(){$('tabs').innerHTML='';$('identityBar').hidden=true;$('main').innerHTML=`<section class="card identity-choice"><h2>选择你的身份</h2><p class="sub">只在这部手机上保存，可随时更改。新建饭单时会默认用这个身份作为买饭人。</p><div class="tools">${BUYERS.map(name=>`<button class="primary" data-identity="${name}">${name}</button>`).join('')}</div></section>`;document.querySelectorAll('[data-identity]').forEach(button=>button.onclick=async()=>{localStorage.setItem('lab-meal-identity',button.dataset.identity);updateIdentityUI();await startApp()})}
async function startApp(){await load();if(!subscribed){subscribe();subscribed=true}}
function renderTabs(){$('tabs').innerHTML=`<button class="${active==='overview'?'active':''}" data-tab="overview">全览</button>${MEALS.map(m=>`<button class="${active===m.id?'active':''}" data-tab="${m.id}">${m.label}</button>`).join('')}`}
function stats(){const rows=ledger.people.map(person=>({person,unpaid:MEALS.map(meal=>({meal,r:entry(meal.id,person.id)})).filter(x=>x.r.cents>0&&!x.r.settled)}));const open=rows.filter(x=>x.unpaid.length);return{rows,open,total:open.reduce((s,x)=>s+x.unpaid.reduce((a,y)=>a+y.r.cents,0),0)}}
function peoplePanel(){return `<section class="card"><h2>名单管理</h2><div class="add"><input id="newName" maxlength="20" placeholder="输入新姓名"><button class="primary" id="add">添加</button></div></section>`}
async function addPerson(){const name=$('newName').value.trim();if(!name)return toast('请先输入姓名');const {data,error}=await db.from('people').insert({name}).select().single();if(error)return toast(error.code==='23505'?'名单里已有这个人':error.message);ledger.people.push(data);render();toast(`已添加 ${name}`)}
function bindAddPerson(){$('add').onclick=addPerson;$('newName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addPerson()}}}
function renderOverview(){const s=stats();$('main').innerHTML=`<div class="metrics"><div class="metric"><span>未结清人数</span><strong class="orange">${s.open.length} 人</strong></div><div class="metric"><span>待收总额</span><strong class="orange">${money(s.total)}</strong></div></div><section class="card"><h2>付款情况全览</h2><p class="sub">橙色为未结清项；后面的名字就是这笔钱应转给谁。</p><ul class="list">${s.rows.map(({person,unpaid})=>`<li class="overview-row"><span class="name" style="grid-row:auto">${esc(person.name)}</span><span class="chips">${unpaid.length?unpaid.map(x=>`<span class="chip">${x.meal.label} ${money(x.r.cents)} ${x.r.buyer}</span>`).join(''):'<span class="paid">已全部结清</span>'}</span></li>`).join('')}</ul></section>${peoplePanel()}<section class="card"><h2>账本备份</h2><p class="sub">导出当前云端记录到手机文件。</p><div class="tools"><button class="secondary" id="export">导出备份</button></div></section>`;bindAddPerson();$('export').onclick=exportData}
function mealStats(mealId){const total=ledger.people.reduce((s,p)=>s+entry(mealId,p.id).cents,0),open=ledger.people.reduce((s,p)=>{const r=entry(mealId,p.id);return s+(r.cents&&!r.settled?r.cents:0)},0);return{total,open}}
function updateMealTotals(mealId){const totals=mealStats(mealId);$('mealTotal').textContent=`本顿已登记 ${money(totals.total)}`;$('mealOpen').textContent=`未结清 ${money(totals.open)}`}
function renderMeal(mealId){const meal=MEALS.find(x=>x.id===mealId),totals=mealStats(mealId);$('main').innerHTML=`<section class="card"><h2>${meal.label}</h2><p class="note">每人填写买了什么、应付金额和买饭人，再用开关标记是否结清。</p><ul class="list">${ledger.people.map(p=>{const r=entry(mealId,p.id);return `<li class="meal-row"><span class="name">${esc(p.name)}</span><input class="food" data-food="${p.id}" maxlength="80" value="${esc(r.food)}" placeholder="买了什么"><input class="amount" data-amount="${p.id}" type="number" min="0" step="0.01" inputmode="decimal" value="${r.cents?(r.cents/100).toFixed(2):''}" placeholder="应付金额"><select class="buyer-select buyer-field" data-buyer="${p.id}" aria-label="买饭人">${BUYERS.map(n=>`<option ${n===r.buyer?'selected':''}>${n}</option>`).join('')}</select><label class="settle"><span class="switch"><input data-settled="${p.id}" type="checkbox" ${r.settled?'checked':''} ${r.cents?'':'disabled'}><span class="slider"></span></span><span data-settled-label="${p.id}">${r.settled?'结清':'未结清'}</span></label></li>`}).join('')}</ul><div class="total"><span id="mealTotal">本顿已登记 ${money(totals.total)}</span><span class="orange" id="mealOpen">未结清 ${money(totals.open)}</span></div></section>${peoplePanel()}`;bindMeal(mealId)}
async function saveEntry(mealId,personId,patch){refreshPausedUntil=Date.now()+900;const old=entry(mealId,personId),next={...old,...patch};const index=ledger.entries.findIndex(x=>x.meal_id===mealId&&x.person_id===personId);if(index>=0)ledger.entries[index]=next;else ledger.entries.push(next);let result;if(!next.food&&next.cents===0)result=await db.from('meal_entries').delete().eq('meal_id',mealId).eq('person_id',personId);else result=await db.from('meal_entries').upsert(next,{onConflict:'meal_id,person_id'});if(result.error){toast(result.error.message);await load()}}
function bindMeal(mealId){document.querySelectorAll('[data-food]').forEach(n=>n.onchange=()=>saveEntry(mealId,n.dataset.food,{food:n.value.trim()}));document.querySelectorAll('[data-buyer]').forEach(n=>n.onchange=()=>saveEntry(mealId,n.dataset.buyer,{buyer:n.value}));document.querySelectorAll('[data-amount]').forEach(n=>n.onchange=()=>{const raw=Number(n.value),cents=Number.isFinite(raw)&&raw>0?Math.round(raw*100):0,old=entry(mealId,n.dataset.amount),row=n.closest('.meal-row'),toggle=row.querySelector('[data-settled]');saveEntry(mealId,n.dataset.amount,{cents,settled:cents?old.settled:false});toggle.disabled=!cents;if(!cents){toggle.checked=false;row.querySelector('[data-settled-label]').textContent='未结清'}updateMealTotals(mealId)});document.querySelectorAll('[data-settled]').forEach(n=>n.onchange=()=>{saveEntry(mealId,n.dataset.settled,{settled:n.checked});n.closest('.settle').querySelector('[data-settled-label]').textContent=n.checked?'结清':'未结清';updateMealTotals(mealId)});bindAddPerson()}
function exportData(){const out={exportedAt:new Date().toLocaleString('zh-CN'),meals:MEALS.map(m=>({meal:m.label,people:ledger.people.map(p=>{const r=entry(m.id,p.id);return{name:p.name,buyer:r.buyer,food:r.food,amount:r.cents/100,settled:r.settled}})}))},blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`实验室买饭账本备份-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}
function render(){updateIdentityUI();renderTabs();active==='overview'?renderOverview():renderMeal(active)}function subscribe(){db.channel('ledger-sync').on('postgres_changes',{event:'*',schema:'public',table:'people'},scheduleLoad).on('postgres_changes',{event:'*',schema:'public',table:'meal_entries'},scheduleLoad).subscribe();setInterval(scheduleLoad,15000)}$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;active=b.dataset.tab;render()};$('changeIdentity').onclick=showIdentity;
if(!configured()){$('main').innerHTML='<section class="card identity-choice"><h2>尚未配置 Supabase</h2><p class="sub">请先按 README 填写 config.js 中的 Project URL 和 publishable key。</p></section>'}else{db=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);identity()?await startApp():showIdentity()}
</script></body></html>
